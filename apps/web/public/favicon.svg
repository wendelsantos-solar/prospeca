<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Background: solid primary green -->
  <rect width="48" height="48" rx="12" fill="#0D9E5A"/>

  <!-- Radar icon — thick strokes for legibility at 16×16 -->
  <!-- Outer arcs -->
  <path d="M 14 14 A 14 14 0 0 1 34 14" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 18 18 A 10 10 0 0 1 30 18" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Center dot -->
  <circle cx="24" cy="24" r="2.5" fill="white"/>

  <!-- Sweep line -->
  <line x1="24" y1="24" x2="36" y2="12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Blip dots -->
  <circle cx="30" cy="16" r="1.5" fill="white"/>
  <circle cx="22" cy="34" r="1.5" fill="white"/>
</svg>
