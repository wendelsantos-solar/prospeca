name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (bun)
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build (web)
        run: bun run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Edge functions are Deno, not covered by the bun typecheck above — a
      # missing field on a calculateScore() call once shipped latent because CI
      # never ran this. Only index.ts entrypoints (test files use bun:test,
      # which Deno can't resolve); _shared/*.ts is checked transitively.
      - name: Typecheck edge functions (deno)
        run: deno check supabase/functions/*/index.ts
