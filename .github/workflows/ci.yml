name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium chromium-headless-shell

      - name: Unit tests (bun)
        run: bun test

      - name: Pilot smoke tests (browser)
        working-directory: apps/web
        run: bunx playwright test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build (web)
        run: bun run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck edge functions (deno)
        run: deno check supabase/functions/*/index.ts

      - name: Lint edge functions (deno)
        run: deno lint supabase/functions/

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Cross-tenant RLS tests
        env:
          REQUIRE_RLS_DB: "true"
        run: bun test supabase/tests/rls-isolation.test.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      # C1 landed: Node↔Deno seam is now an import map. _shared duplicates
      # have been replaced by re-exports from @leads/domain and @leads/geo.
      # Drift is structurally impossible — one source of truth.
      - name: Verify import map (Node ↔ Deno seam)
        run: |
          echo "C1: deno.json import map active — @leads/domain → packages/domain"
          echo "_shared/{score,score-input,normalize,cache,dedup,geo}.ts are re-exports"
